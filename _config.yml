# Site
repository: dc-tec/portfolio
favicon: assets/images/favicon.ico

# Content configuration version
version: 2

# Personal info
title: deCort.tech
first_name: Roel
author: Roel de Cort
email: roel@decort.tech

theme: null

# Social links
github_username: dc-tec
gitlab_username: dc-tec
linkedin_username: roel-de-cort

# Additiona# Blog settings
show_excerpts: true

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Build settings
markdown: kramdown
highlighter: rouge

sass:
  sass_dir: assets/scss
  style: compressed
  load_paths:
    - .
    - assets/scss
  sourcemap: development
  quiet_deps: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

# Navigation
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /blog/:year/:month/:day/:title/

# Blog pagination
paginate: 9
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CNAME
  - Dockerfile
  - docker-compose.yml
  - serve.sh
  - ACTION_PLAN.md
  - .devenv
  - devenv.nix
  - devenv.yaml
  - devenv.lock
  - .devenv.flake.nix
  - .direnv
  - backup
