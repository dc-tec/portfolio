# Site
repository: dc-tec/portfolio
favicon: images/favicon.ico

# Content configuration version
version: 2

website_title: deCort.tech

# Personal info
name: Roel
title: deCort.tech
email: roel@decort.tech
website: decort.tech

# Dark Mode (true/false/never)
darkmode: true

# Social links
github_username: dc-tec
gitlab_username: dc-tec
linkedin_username: roel-de-cort

# Additional icon links
additional_links:
  - title: Blog
    icon: fas fa-blog
    url: /blog/

# Blog settings
show_excerpts: true
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

footer_show_references: false

# Theme settings - use the GitHub Pages compatible approach
# theme: minima # Commented out as we have a full custom theme

# Build settings
markdown: kramdown
highlighter: rouge

sass:
  sass_dir: assets/scss
  style: compressed
  load_paths:
    - assets/scss

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

# Navigation
header_pages:
  - index.md
  - blog/index.html

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /blog/:year/:month/:day/:title/
  - scope:
      path: ""
      type: "portfolio_sections"
    values:
      layout: "portfolio_section"

# Blog pagination
paginate: 9
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CNAME
  - Dockerfile
  - docker-compose.yml
  - serve.sh
